[project]
name = "advisor-api"
version = "0.1.0"
description = "advisor-lite backend: portfolio-counseling agent demo"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-ai-slim[anthropic,openai,google]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-ai-harness[exa]>=0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty",
    "asgi-lifespan>=2.1",
    "pydantic-evals>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.src]
include = ["src", "tests", "evals", "scripts"]
